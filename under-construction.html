<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Applied Business Development | Under Construction</title>
    <meta
      name="description"
      content="Applied Business Development website is currently under construction."
    />
    <style>
      :root {
        --bg-start: #0e1c2f;
        --bg-end: #18314f;
        --card: rgba(255, 255, 255, 0.08);
        --text: #f5f8fc;
        --muted: #d6e1ef;
        --accent: #f0b429;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 20% 20%, rgba(240, 180, 41, 0.2), transparent 40%),
          linear-gradient(145deg, var(--bg-start), var(--bg-end));
        padding: 24px;
      }

      .card {
        width: min(720px, 100%);
        background: var(--card);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        padding: 40px 32px;
        text-align: center;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
      }

      .logo {
        width: 220px;
        max-width: 80%;
        height: auto;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.8rem, 3.2vw, 2.8rem);
        line-height: 1.2;
      }

      p {
        margin: 0 auto;
        max-width: 52ch;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.6;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 22px;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(240, 180, 41, 0.2);
        color: #ffe4a0;
        font-weight: 600;
        font-size: 0.95rem;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
        animation: pulse 1.6s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(0.9);
          opacity: 0.7;
        }
        50% {
          transform: scale(1.2);
          opacity: 1;
        }
      }
    </style>
  </head>

  <body>
    <main class="card" role="main" aria-live="polite">
      <img src="images/schraudy-logo.svg" alt="Schraudy logo" class="logo" />
      <h1>Website Under Construction</h1>
      <p>
        We are currently updating this website to provide you with an improved experience.
        Please check back soon.
      </p>
      <div class="status">
        <span class="dot" aria-hidden="true"></span>
        Work in progress
      </div>
    </main>
  </body>
</html>
