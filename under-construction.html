<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Applied Business Development | Under Construction</title>
    <meta
      name="description"
      content="Applied Business Development website is currently under construction."
    />
    <style>
      :root {
        --bg-start: #07152a;
        --bg-mid: #0f2c52;
        --bg-end: #13233f;
        --card: rgba(12, 27, 49, 0.68);
        --card-border: rgba(117, 188, 255, 0.32);
        --text: #eaf3ff;
        --muted: #c1d7ef;
        --accent: #59c4ff;
        --accent-2: #3b82f6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        color: var(--text);
        background:
          radial-gradient(
            circle at 82% 14%,
            rgba(89, 196, 255, 0.28),
            transparent 36%
          ),
          radial-gradient(
            circle at 12% 80%,
            rgba(59, 130, 246, 0.24),
            transparent 38%
          ),
          linear-gradient(145deg, var(--bg-start), var(--bg-mid), var(--bg-end));
        padding: 24px;
      }

      .card {
        width: min(720px, 100%);
        position: relative;
        overflow: hidden;
        border-radius: 18px;
        background: var(--card);
        border: 1px solid var(--card-border);
        box-shadow: 0 28px 60px rgba(3, 11, 23, 0.55);
        backdrop-filter: blur(14px);
        padding: 40px 32px;
        text-align: center;
      }

      .card::before {
        content: "";
        position: absolute;
        inset: -2px;
        background: linear-gradient(
          120deg,
          rgba(89, 196, 255, 0.18),
          transparent 35%,
          transparent 65%,
          rgba(59, 130, 246, 0.22)
        );
        pointer-events: none;
      }

      .logo {
        width: 220px;
        max-width: 80%;
        height: auto;
        margin-bottom: 100px;
        filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.35));
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.8rem, 3.2vw, 2.8rem);
        line-height: 1.2;
        letter-spacing: 0.02em;
        text-wrap: balance;
      }

      p {
        margin: 0 auto;
        max-width: 52ch;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.6;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 26px;
        padding: 10px 16px;
        border-radius: 999px;
        background: rgba(89, 196, 255, 0.12);
        border: 1px solid rgba(89, 196, 255, 0.35);
        color: #d5ebff;
        font-weight: 600;
        font-size: 0.95rem;
      }

      .legal-links {
        margin-top: 20px;
        display: flex;
        justify-content: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .legal-links a {
        color: #d5ebff;
        text-underline-offset: 3px;
        font-size: 0.95rem;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 5px rgba(89, 196, 255, 0.2);
        animation: pulse 1.6s ease-in-out infinite;
      }

      @media (max-width: 640px) {
        .card {
          padding: 32px 22px;
        }

        .logo {
          width: 190px;
          margin-bottom: 100px;
        }

        h1 {
          font-size: clamp(1.6rem, 8vw, 2.1rem);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(0.9);
          opacity: 0.7;
        }
        50% {
          transform: scale(1.2);
          opacity: 1;
        }
      }
    </style>
  </head>

  <body>
    <main class="card" role="main" aria-live="polite">
      <img
        src="images/applied-bd-logo.svg"
        alt="Applied BD logo"
        class="logo"
      />
      <h1>Website Under Construction</h1>
      <p>
        We are currently updating this website to provide you with an improved
        experience. Please check back soon.
      </p>
      <div class="status">
        <span class="dot"></span>
        <span>We'll be back soon!</span>
      </div>
      <nav class="legal-links" aria-label="Legal links">
        <a href="impressum.html">Impressum</a>
        <a href="datenschutz.html">Datenschutz</a>
      </nav>
    </main>
  </body>
</html>
