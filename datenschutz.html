<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Datenschutzerklärung | Applied Business Development</title>
    <meta
      name="description"
      content="Datenschutzerklärung gemäß DSGVO für Applied Business Development."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="legal.css" />
  </head>
  <body>
    <a class="legal-top-link" href="index.html?preview=1">Zur Website</a>
    <main class="page">
      <h1>Datenschutzerklärung</h1>
      <p class="updated">Stand: 18.05.2026</p>

      <p class="legal-note">
        Die folgende Datenschutzerklärung basiert auf den bereitgestellten
        Unternehmensangaben.
      </p>

      <article class="legal-document" id="privacy-document" aria-live="polite">
        <p>Lade Datenschutzerklärung…</p>
      </article>

      <div class="meta-links">
        <a href="impressum.html">Impressum</a>
        <a href="under-construction.html">Startseite</a>
      </div>
    </main>

    <script>
      (function loadPrivacyText() {
        const target = document.getElementById("privacy-document");

        fetch("imprint_data privacy/Data Privacy.txt")
          .then((response) => {
            if (!response.ok) {
              throw new Error("Failed to load privacy text");
            }

            return response.text();
          })
          .then((text) => {
            const normalized = text
              .replace(/\u200b/g, "")
              .split(/\r?\n/)
              .map((line) => line.trim())
              .filter((line) => line.length > 0)
              .join("\n\n");

            target.innerHTML = normalized
              .split(/\n\n+/)
              .map((paragraph) => `<p>${paragraph}</p>`)
              .join("");
          })
          .catch(() => {
            target.innerHTML =
              "<p>Die Datenschutzerklärung konnte nicht geladen werden. Bitte kontaktieren Sie uns unter <a href='mailto:info@applied-bd.com'>info@applied-bd.com</a>.</p>";
          });
      })();
    </script>
  </body>
</html>
